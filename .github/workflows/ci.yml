name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/OrderShop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OrderShop.sln

      - name: Build
        run: dotnet build OrderShop.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test OrderShop.sln --no-build --configuration Release
